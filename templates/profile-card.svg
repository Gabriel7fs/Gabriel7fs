<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
  <title id="title">$display_name — $headline</title>
  <desc id="desc">Public GitHub data for $username: $public_repos public repositories, $stars stars on original public repositories, and $followers followers. $featured_stack. Learning $featured_learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#0B111B"/>
      <stop offset="0.6" stop-color="#101C2C"/>
      <stop offset="1" stop-color="#152E47"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#4682B4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4682B4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4682B4"/>
      <stop offset="1" stop-color="#8BC8F6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8CB8E0" stroke-width="0.6" opacity="0.09"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1278" height="578" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="580" fill="url(#bg)"/>
    <ellipse cx="1050" cy="90" rx="490" ry="355" fill="url(#glow)"/>
    <rect x="704" width="576" height="580" fill="url(#grid)"/>
    <path d="M1216 0V36H1176V65H1112" fill="none" stroke="#75A9D6" stroke-width="1" opacity="0.3"/>
    <circle cx="1112" cy="65" r="3" fill="#75A9D6" opacity="0.5"/>
    <path d="M1279 286H1233V313H1182" fill="none" stroke="#75A9D6" stroke-width="1" opacity="0.3"/>
    <circle cx="1182" cy="313" r="3" fill="#75A9D6" opacity="0.5"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="64" y="47" width="28" height="28" rx="8" fill="#4682B4" fill-opacity="0.18" stroke="#4B769D"/>
      <path d="m75 56-5 5 5 5m7-10 5 5-5 5" fill="none" stroke="#A5D6FB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="108" y="66" fill="#A9C7E1" font-size="13" font-weight="600" letter-spacing="2.6">WELCOME TO MY GITHUB</text>
      <text x="64" y="169" fill="#F3F7FB" font-size="66" font-weight="700" letter-spacing="-1.7">$display_name</text>
      <rect x="66" y="197" width="42" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="124" y="209" fill="#9ECAE9" font-size="29" font-weight="400">$headline</text>
      <text x="66" y="264" fill="#BBC8D6" font-size="21">$summary</text>
      <text x="66" y="295" fill="#889BAF" font-size="19">$detail</text>
    </g>

    <g transform="translate(780 98)">
      <rect x="8" y="10" width="426" height="224" rx="14" fill="#020710" opacity="0.3"/>
      <rect width="426" height="224" rx="14" fill="#0B1421" stroke="#34506B"/>
      <path d="M14 0H412Q426 0 426 14V39H0V14Q0 0 14 0" fill="#172638"/>
      <path d="M0 39H426" stroke="#2A4159"/>
      <circle cx="20" cy="20" r="4" fill="#587289"/>
      <circle cx="35" cy="20" r="4" fill="#719AB8"/>
      <circle cx="50" cy="20" r="4" fill="#A0C7E0"/>
      <text x="212" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#A1B3C6">github-profile.ts</text>
      <g font-family="monospace" font-size="18" xml:space="preserve">
        <g fill="#496077" text-anchor="end">
          <text x="29" y="76">1</text><text x="29" y="103">2</text><text x="29" y="130">3</text><text x="29" y="157">4</text><text x="29" y="184">5</text>
        </g>
        <text x="48" y="76"><tspan fill="#B59EDE">const </tspan><tspan fill="#90C9F1">github </tspan><tspan fill="#B7C7D6">= {</tspan></text>
        <text x="65" y="103"><tspan fill="#B5C5D6">publicRepos: </tspan><tspan fill="#A6CCA5">$public_repos</tspan><tspan fill="#B5C5D6">,</tspan></text>
        <text x="65" y="130"><tspan fill="#B5C5D6">stars: </tspan><tspan fill="#A6CCA5">$stars</tspan><tspan fill="#B5C5D6">,</tspan></text>
        <text x="65" y="157"><tspan fill="#B5C5D6">followers: </tspan><tspan fill="#A6CCA5">$followers</tspan></text>
        <text x="48" y="184" fill="#B5C5D6">};</text>
        <rect x="72" y="171" width="8" height="17" fill="#79B6E2" opacity="0.85"/>
      </g>
    </g>

    <path d="M64 351H1216" stroke="#2B3F54"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="66" y="383" font-size="11" fill="#7E98B1" font-weight="600" letter-spacing="2">TECHNOLOGIES</text>
      <text x="66" y="413" font-size="21" fill="#DFE9F2">$featured_stack</text>
      <path d="M425 376V421" stroke="#2B3F54"/>
      <text x="464" y="383" font-size="11" fill="#7E98B1" font-weight="600" letter-spacing="2">CURRENTLY LEARNING</text>
      <text x="464" y="413" font-size="22" fill="#DFE9F2">$featured_learning</text>
      <path d="M858 376V421" stroke="#2B3F54"/>
      <text x="897" y="383" font-size="11" fill="#7E98B1" font-weight="600" letter-spacing="2">$username</text>
      <text x="897" y="413" font-size="22" fill="#A5D6FB">Explore my projects</text>
      <path d="M1189 411l16-16m-13 0h13v13" fill="none" stroke="#A5D6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M64 446H1216" stroke="#2B3F54"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="66" y="468" fill="#8AA2B9" font-size="11" font-weight="600" letter-spacing="1.2">LANGUAGES / PUBLIC ORIGINAL REPOSITORIES</text>
      $languages
      <text x="66" y="554" fill="#738BA2" font-size="11">Code bytes • Excludes forks and profile repository</text>
      <text x="1214" y="554" text-anchor="end" fill="#8CA6BE" font-size="11">Updated $updated</text>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="578" rx="24" fill="none" stroke="#32485E"/>
</svg>
